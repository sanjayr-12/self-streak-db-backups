name: MongoDB Backup to Cloudflare R2

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Enables manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  backup:
    name: Backup MongoDB to Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies (mongodump & AWS CLI)
        run: |
          echo "=== Installing MongoDB Database Tools ==="
          curl -fsSL "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb" -o /tmp/mongodb-tools.deb
          sudo apt-get install -y /tmp/mongodb-tools.deb
          rm -f /tmp/mongodb-tools.deb
          mongodump --version

          echo "=== Verifying AWS CLI ==="
          if ! command -v aws &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y awscli
          fi
          aws --version

      - name: Create & Upload MongoDB Backup
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Validate required secrets
          if [ -z "$MONGO_URI" ]; then
            echo "::error::Secret MONGO_URI is missing!"
            exit 1
          fi
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::One or more Cloudflare R2 secrets are missing! Check R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID, R2_BUCKET."
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILENAME="backup_${TIMESTAMP}.archive.gz"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Creating compressed MongoDB backup archive: ${BACKUP_FILENAME}..."
          mongodump --uri="${MONGO_URI}" --archive="${BACKUP_FILENAME}" --gzip

          BACKUP_SIZE=$(ls -lh "${BACKUP_FILENAME}" | awk '{print $5}')
          echo "Backup archive created successfully (Size: ${BACKUP_SIZE})."

          echo "Uploading to Cloudflare R2 bucket: ${R2_BUCKET}..."
          aws s3 cp "${BACKUP_FILENAME}" "s3://${R2_BUCKET}/${BACKUP_FILENAME}" \
            --endpoint-url "${R2_ENDPOINT}"

          echo "Verifying upload in R2 bucket..."
          aws s3 ls "s3://${R2_BUCKET}/${BACKUP_FILENAME}" \
            --endpoint-url "${R2_ENDPOINT}"

          echo "Cleaning up local backup archive..."
          rm -f "${BACKUP_FILENAME}"
          echo "Backup and upload completed successfully!"

      - name: Keep-Alive Auto-Commit
        run: |
          echo "=== Keep-Alive Health Check ==="
          # GitHub automatically pauses scheduled cron workflows after 60 days of repo inactivity.
          # We refresh keepalive.txt whenever the last commit is >= 30 days old or keepalive.txt is missing.
          LAST_COMMIT_TS=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          NOW_TS=$(date +%s)
          DAYS_SINCE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))

          echo "Days since last repository commit: ${DAYS_SINCE}"

          if [ ! -f keepalive.txt ] || [ "$DAYS_SINCE" -ge 30 ]; then
            echo "Refreshing keepalive.txt to preserve scheduled runs..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "Last automated backup: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > keepalive.txt
            git add keepalive.txt
            git commit -m "chore(backup): keepalive ping [skip ci]"
            git push
            echo "Keep-alive commit pushed successfully."
          else
            echo "Repository has recent activity (${DAYS_SINCE} days ago). No keepalive commit needed."
          fi
